services:
  postgres:
    image: postgres:17
    container_name: web3-asset-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: web3user
      POSTGRES_PASSWORD: web3password
      POSTGRES_DB: web3asset
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: